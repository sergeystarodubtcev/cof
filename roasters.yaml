# Реестр российских specialty-обжарщиков.
#
# Чтобы добавить обжарщика, достаточно имени, города и сайта: платформа магазина
# (Shopify / WooCommerce / InSales / Tilda / Ecwid / любой сайт с sitemap + JSON-LD)
# определяется автоматически при каждом запуске парсера.
#
# Поля:
#   id          — латиница, уникальный ключ
#   site        — главная страница магазина
#   catalog     — (необяз.) страницы каталога кофе, с них начинается обход
#   platform    — (необяз.) принудительная платформа: shopify|woocommerce|insales|tilda|ecwid|generic
#   roast       — когда обжаривают (влияет на оценку сроков доставки)
#   roast_lag   — сколько рабочих дней от заказа до отправки (по умолчанию 1)
#   delivery    — способы и условия доставки
#   verified    — false = адрес взят из вторичных источников; парсер проверит его и отметит в отчёте
#
# Источники отбора: финалисты премии «Обжарщик года 2026» (Coffee Tea Cacao Expo),
# подборки T-J, КП, League of Coffee, каталоги specialty.ru / coffeeroasters.ru / coffeechoice.ru.

