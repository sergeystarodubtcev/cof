<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Зерно — поиск specialty-кофе</title>
<meta name="description" content="Поиск и сравнение specialty-кофе российских обжарщиков: один лот у разных обжарщиков, фильтры по стране, обработке, сорту и вкусу, цены всех фасовок.">
<meta name="theme-color" content="#f5f3ef" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121110" media="(prefers-color-scheme: dark)">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23171513'/%3E%3Cellipse cx='16' cy='16' rx='7' ry='10' fill='%23e8a26b' transform='rotate(35 16 16)'/%3E%3Cpath d='M12 9c4 4 4 10 8 14' stroke='%23171513' stroke-width='1.8' fill='none' transform='rotate(35 16 16)'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Unbounded:wght@500;700&display=swap">
<link rel="stylesheet" href="app.css">
</head>
<body>
<header class="top" id="top">
  <div class="top-in">
    <a class="logo" href="#/" aria-label="Зерно — на главную"><span class="logo-mark"></span><span>Зерно</span></a>
    <div class="search" id="searchbox">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Страна, ферма, сорт, вкус или обжарщик" autocomplete="off" spellcheck="false" aria-label="Поиск">
      <kbd>/</kbd>
      <div id="suggest" class="suggest" hidden></div>
    </div>
    <nav class="nav" aria-label="Разделы">
      <a href="#/" data-nav="catalog">Каталог</a>
      <a href="#/new" data-nav="new">Новинки<b id="newCount"></b></a>
      <a href="#/roasters" data-nav="roasters">Обжарщики</a>
      <a href="#/compare" data-nav="compare">Сравнение<b id="cmpCount"></b></a>
    </nav>
    <label class="city" title="Город доставки — для оценки сроков">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s7-6.1 7-11.5a7 7 0 1 0-14 0C5 14.9 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.4"/></svg>
      <select id="city" aria-label="Город доставки"></select>
    </label>
    <button id="theme" class="icon-btn" aria-label="Сменить тему"><svg viewBox="0 0 24 24"><path d="M20.5 13.4A8.5 8.5 0 1 1 10.6 3.5a6.6 6.6 0 0 0 9.9 9.9z"/></svg></button>
  </div>
</header>
<main id="app"><div class="loading"><span class="spin"></span>Загружаю каталог…</div></main>
<footer class="foot">
  <span id="meta"></span>
  <span>Данные собираются автоматически с сайтов обжарщиков. Цены и наличие уточняйте при заказе.</span>
</footer>
<div id="sheet" class="sheet" hidden></div>
<div id="toast" class="toast" role="status" hidden></div>
<script src="app.js"></script>
</body>
</html>
