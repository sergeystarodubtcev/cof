name: Диагностика сайтов
# Запускается пушем в ветки claude/scrape-check*: проверяет сайты, гоняет парсер
# и коммитит отчёты (data/probe.md, data/report.md, логи) обратно в ту же ветку.
on:
  push:
    branches: ["claude/scrape-check*"]
    paths-ignore: ["data/**", "site/data/**", "site/img/**"]
  workflow_dispatch: {}
permissions:
  contents: write
concurrency: {group: probe, cancel-in-progress: true}
env:
  ONLY: welder,sok,tasty   # пусто = все обжарщики
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.txt
      - name: Доступность сайтов
        run: python -m scraper.probe ${ONLY:+--only $ONLY}
      - name: Парсер
        run: python -m scraper.run ${ONLY:+--only $ONLY} 2>&1 | tee data/scrape.log || true
      - name: Сохранить результаты в ветку
        if: always()
        run: |
          git config user.name "catalog-bot"
          git config user.email "catalog-bot@users.noreply.github.com"
          git add -f data site/data site/img || true
          git commit -m "Диагностика: результаты $(date -u +%F\ %H:%M) UTC" || exit 0
          git pull --rebase -X theirs || true
          git push
