name: Обновление каталога
on:
  schedule:
    - cron: "17 */6 * * *"   # каждые 6 часов
  workflow_dispatch: {}
permissions:
  contents: write
  pages: write
  id-token: write
concurrency: {group: catalog, cancel-in-progress: false}
jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.txt
      - run: python -m pytest -q tests || python tests/test_pipeline.py
      - name: Парсинг сайтов обжарщиков
        run: python -m scraper.run
      - name: Сохранить данные в репозиторий
        run: |
          git config user.name "catalog-bot"
          git config user.email "catalog-bot@users.noreply.github.com"
          git add data site/data site/img
          git diff --cached --quiet || git commit -m "Каталог: $(date -u +%F\ %H:%M) UTC"
          git push
      - uses: actions/upload-pages-artifact@v3
        with: {path: site}
  deploy:
    needs: scrape
    runs-on: ubuntu-latest
    environment: {name: github-pages}
    steps:
      - uses: actions/deploy-pages@v4
