name: Обновление каталога
on:
  schedule:
    - cron: "17 */6 * * *"   # каждые 6 часов: парсинг + публикация
  workflow_dispatch: {}
  push:                       # изменения кода/сайта в main — сразу публикуем, без парсинга
    branches: [main]
    paths: ["site/**", "scraper/**", "roasters.yaml", ".github/workflows/update.yml"]
permissions:
  contents: write
  pages: write
  id-token: write
concurrency: {group: catalog, cancel-in-progress: false}
jobs:
  scrape:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.txt
      - run: python tests/test_pipeline.py
      - name: Парсинг сайтов обжарщиков
        run: python -m scraper.run 2>&1 | tee data/scrape.log
      - name: Сохранить данные в репозиторий
        if: always()
        run: |
          git config user.name "catalog-bot"
          git config user.email "catalog-bot@users.noreply.github.com"
          git add data site/data site/img
          git diff --cached --quiet && exit 0
          git commit -m "Каталог: $(date -u +%F\ %H:%M) UTC"
          git pull --rebase -X theirs && git push
  deploy:
    needs: scrape
    if: always() && (needs.scrape.result == 'success' || needs.scrape.result == 'skipped')
    runs-on: ubuntu-latest
    environment: {name: github-pages, url: "${{ steps.d.outputs.page_url }}"}
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/upload-pages-artifact@v3
        with: {path: site}
      - id: d
        uses: actions/deploy-pages@v4
